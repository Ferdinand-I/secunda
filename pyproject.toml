[project]
name = "secunda-application"
version = "0.1.0"
description = "REST API Secunda"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.3",
    "asyncpg>=0.31.0",
    "fastapi>=0.128.0",
    "greenlet>=3.3.1",
    "pydantic-settings>=2.12.0",
    "sqlalchemy>=2.0.46",
    "uvicorn>=0.40.0",
]

[dependency-groups]
lint = [
    "ruff>=0.14.14",
]

[tool.ruff]
line-length = 110

# Docker compose config for local development
services:

  backend:
    build:
      dockerfile: Dockerfile
      context: .
    container_name: secunda-backend
    env_file: .env
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: /app/start_backend.sh
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src  # Just to reload on change, not needed in production
    healthcheck:
      test: curl --fail http://localhost:8000/api/v1/ping || exit 1
      interval: 30s
      timeout: 5s
      retries: 1
      start_period: 1s

  postgres:
    image: postgres:latest
    container_name: secunda-postgres
    env_file: .env
    environment:
      POSTGRES_USER: $DB__USER
      POSTGRES_PASSWORD: $DB__PASSWORD
      POSTGRES_DB: $DB__NAME
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/18/main
    healthcheck:
      test: [ "CMD", "pg_isready", "--username=${DB__USER}" ]
      interval: 30s
      timeout: 5s
      retries: 1
      start_period: 1s
